{% extends "base.html" %}
{% block content %}
<h2>Upload Image for Analysis</h2>
<p>Upload an image to see if it was created by AI or is a real photograph.</p>
<form method="POST" enctype="multipart/form-data">
    <input type="file" name="image" accept="image/*" required style="margin-bottom: 15px;">
    <br>
    <button type="submit" class="btn">Analyze Image</button>
</form>
{% endblock %}
